{% extends "base.html" %}{% block title %}My profile{% endblock %}{% block content %}
<div class="eyebrow">ACCOUNT SETTINGS</div><h2>My profile</h2><p class="text-muted">Keep your student and career details up to date.</p>
<div class="content-card form-narrow"><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" value="{{ user['name'] }}" required><label class="form-label">Email address</label><input class="form-control mb-3" value="{{ user['email'] }}" disabled><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ user['phone'] or '' }}"><label class="form-label">College / Institution</label><input class="form-control mb-3" name="college" value="{{ user['college'] or '' }}"><label class="form-label">Qualification</label><input class="form-control mb-4" name="qualification" value="{{ user['qualification'] or '' }}"><button class="btn btn-primary">Save profile</button></form></div>{% endblock %}
